<svg width="1600" height="500" viewBox="0 0 1600 500" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1600" y2="500">

<stop offset="0%" stop-color="#040B1F">
<animate attributeName="stop-color"
values="#040B1F;#08142E;#040B1F"
dur="10s"
repeatCount="indefinite"/>

</stop>

<stop offset="100%" stop-color="#0B1D3A">
<animate attributeName="stop-color"
values="#0B1D3A;#111827;#0B1D3A"
dur="10s"
repeatCount="indefinite"/>

</stop>

</linearGradient>

<filter id="glow">

<feGaussianBlur stdDeviation="4" result="blur"/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>

<rect width="1600" height="500" fill="url(#bg)"/>

<!-- GRID -->

<g opacity=".08">

<path d="M0 50H1600"/>
<path d="M0 100H1600"/>
<path d="M0 150H1600"/>
<path d="M0 200H1600"/>
<path d="M0 250H1600"/>
<path d="M0 300H1600"/>
<path d="M0 350H1600"/>
<path d="M0 400H1600"/>
<path d="M0 450H1600"/>

</g>

<!-- CONNECTIONS -->

<g stroke="#22D3EE" stroke-width="2" opacity=".4">

<line x1="1050" y1="120" x2="1200" y2="190"/>

<line x1="1200" y1="190" x2="1380" y2="140"/>

<line x1="1200" y1="190" x2="1300" y2="320"/>

<line x1="1300" y1="320" x2="1120" y2="360"/>

<line x1="1120" y1="360" x2="980" y2="250"/>

<line x1="980" y1="250" x2="1050" y2="120"/>

</g>

<!-- NODES -->

<g fill="#22D3EE" filter="url(#glow)">

<circle cx="1050" cy="120" r="6">

<animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite"/>

</circle>

<circle cx="1200" cy="190" r="6">

<animate attributeName="r" values="6;10;6" begin=".4s" dur="2s" repeatCount="indefinite"/>

</circle>

<circle cx="1380" cy="140" r="6">

<animate attributeName="r" values="6;10;6" begin=".8s" dur="2s" repeatCount="indefinite"/>

</circle>

<circle cx="1300" cy="320" r="6">

<animate attributeName="r" values="6;10;6" begin="1.2s" dur="2s" repeatCount="indefinite"/>

</circle>

<circle cx="1120" cy="360" r="6">

<animate attributeName="r" values="6;10;6" begin="1.6s" dur="2s" repeatCount="indefinite"/>

</circle>

<circle cx="980" cy="250" r="6">

<animate attributeName="r" values="6;10;6" begin="2s" dur="2s" repeatCount="indefinite"/>

</circle>

</g>

<!-- FLOATING PARTICLES -->

<g fill="#67E8F9">

<circle cx="200" cy="430" r="2">

<animate attributeName="cy" values="430;40;430" dur="12s" repeatCount="indefinite"/>

</circle>

<circle cx="500" cy="420" r="3">

<animate attributeName="cy" values="420;50;420" dur="9s" repeatCount="indefinite"/>

</circle>

<circle cx="800" cy="460" r="2">

<animate attributeName="cy" values="460;70;460" dur="15s" repeatCount="indefinite"/>

</circle>

<circle cx="1500" cy="430" r="3">

<animate attributeName="cy" values="430;20;430" dur="10s" repeatCount="indefinite"/>

</circle>

</g>

<!-- TITLE -->

<text
x="120"
y="140"
font-size="28"
fill="#7DD3FC"
font-family="Segoe UI">

👋 Hello, I'm

</text>

<text
x="120"
y="220"
font-size="58"
font-weight="bold"
fill="white"
font-family="Segoe UI">

JEMELREY ABASTILLAS

</text>

<text
x="120"
y="270"
font-size="24"
fill="#A5F3FC"
font-family="Segoe UI">

Computer Engineering Student

</text>

<text
x="120"
y="305"
font-size="24"
fill="#A5F3FC"
font-family="Segoe UI">

AI • Machine Learning • Robotics • Embedded Systems

</text>

<text
x="120"
y="365"
font-size="20"
fill="#94A3B8"
font-family="Segoe UI">

Building intelligent systems where hardware meets software.

</text>

<!-- GLOW LINE -->

<rect x="120" y="395" width="420" height="4" fill="#22D3EE">

<animate attributeName="width"
values="0;420;0"
dur="4s"
repeatCount="indefinite"/>

</rect>

</svg>
