<svg 
width="1600" 
height="520" 
viewBox="0 0 1600 520" 
fill="none" 
xmlns="http://www.w3.org/2000/svg">


<defs>


<!-- Background Gradient -->

<linearGradient id="background" x1="0" y1="0" x2="1600" y2="520">

<stop offset="0%" stop-color="#020617">

<animate 
attributeName="stop-color"
values="#020617;#07152F;#020617"
dur="12s"
repeatCount="indefinite"/>

</stop>


<stop offset="50%" stop-color="#111827">

<animate
attributeName="stop-color"
values="#111827;#172554;#111827"
dur="12s"
repeatCount="indefinite"/>

</stop>


<stop offset="100%" stop-color="#020617">

<animate
attributeName="stop-color"
values="#020617;#0F172A;#020617"
dur="12s"
repeatCount="indefinite"/>

</stop>


</linearGradient>



<!-- Cyan Glow -->

<filter id="glow">

<feGaussianBlur 
stdDeviation="5"
result="blur"/>


<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>


</filter>



<!-- Text Gradient -->

<linearGradient id="textGradient">

<stop offset="0%" stop-color="#22D3EE"/>

<stop offset="50%" stop-color="#A78BFA"/>

<stop offset="100%" stop-color="#38BDF8"/>


</linearGradient>


</defs>




<!-- BACKGROUND -->


<rect 
width="1600" 
height="520"
fill="url(#background)"
rx="25"/>





<!-- GRID -->

<g opacity="0.08" stroke="#38BDF8">


<path d="M0 100H1600"/>

<path d="M0 200H1600"/>

<path d="M0 300H1600"/>

<path d="M0 400H1600"/>


<path d="M200 0V520"/>

<path d="M400 0V520"/>

<path d="M600 0V520"/>

<path d="M800 0V520"/>

<path d="M1000 0V520"/>

<path d="M1200 0V520"/>

<path d="M1400 0V520"/>


</g>





<!-- LEFT CONTENT -->


<text
x="120"
y="130"
fill="#67E8F9"
font-size="28"
font-family="JetBrains Mono, monospace">


HELLO, I'M


</text>



<text
x="120"
y="210"
fill="url(#textGradient)"
font-size="65"
font-weight="700"
font-family="Arial, sans-serif"
filter="url(#glow)">


JEMELREY ABASTILLAS


</text>




<text
x="120"
y="270"
fill="#E2E8F0"
font-size="30"
font-family="Arial, sans-serif">


Computer Engineering Student


</text>




<text
x="120"
y="325"
fill="#94A3B8"
font-size="24"
font-family="Arial, sans-serif">


AI / Machine Learning • Robotics • Embedded Systems


</text>



<text
x="120"
y="370"
fill="#64748B"
font-size="20"
font-family="Arial, sans-serif">


Building intelligent systems where hardware meets software.


</text>





<!-- STATUS CHIP -->


<rect
x="120"
y="420"
width="300"
height="45"
rx="22"
fill="#0F172A"
stroke="#22D3EE"
stroke-width="2"/>



<circle
cx="150"
cy="442"
r="7"
fill="#22C55E">

<animate
attributeName="opacity"
values="1;0.3;1"
dur="2s"
repeatCount="indefinite"/>

</circle>



<text
x="175"
y="450"
fill="#CBD5E1"
font-size="18"
font-family="JetBrains Mono, monospace">


AVAILABLE FOR BUILDING


</text>





<!-- RIGHT SIDE PLACEHOLDER -->

<g opacity="0.3">


<circle
cx="1250"
cy="250"
r="130"
stroke="#22D3EE"
stroke-width="2"/>


<circle
cx="1250"
cy="250"
r="180"
stroke="#A78BFA"
stroke-width="1"/>


</g>



</svg>
