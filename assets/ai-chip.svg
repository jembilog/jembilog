<svg 
width="700" 
height="500" 
viewBox="0 0 700 500"
xmlns="http://www.w3.org/2000/svg">


<defs>

<linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#22D3EE"/>

<stop offset="50%" stop-color="#A78BFA"/>

<stop offset="100%" stop-color="#38BDF8"/>

</linearGradient>


<filter id="glow">

<feGaussianBlur stdDeviation="8"/>

</filter>


</defs>




<!-- BACKGROUND -->

<rect 
width="700"
height="500"
rx="30"
fill="#020617"/>




<!-- GLOW -->

<circle
cx="350"
cy="250"
r="170"
fill="#22D3EE"
opacity="0.15"
filter="url(#glow)">


<animate

attributeName="r"

values="150;190;150"

dur="5s"

repeatCount="indefinite"/>

</circle>





<!-- CHIP BODY -->


<rect

x="220"

y="120"

width="260"

height="260"

rx="35"

fill="#0F172A"

stroke="url(#chip)"

stroke-width="5"/>






<!-- CHIP INNER -->


<rect

x="270"

y="170"

width="160"

height="160"

rx="20"

fill="#020617"

stroke="#22D3EE"

stroke-width="3"/>





<!-- AI CORE -->


<circle

cx="350"

cy="250"

r="45"

fill="url(#chip)">


<animate

attributeName="r"

values="45;55;45"

dur="2s"

repeatCount="indefinite"/>


</circle>



<text

x="327"

y="260"

fill="white"

font-size="28"

font-family="monospace">

AI

</text>







<!-- CIRCUIT PINS -->


<g stroke="#38BDF8" stroke-width="4">


<!-- LEFT -->

<line x1="180" y1="170" x2="220" y2="170"/>

<line x1="180" y1="220" x2="220" y2="220"/>

<line x1="180" y1="280" x2="220" y2="280"/>

<line x1="180" y1="330" x2="220" y2="330"/>



<!-- RIGHT -->


<line x1="480" y1="170" x2="520" y2="170"/>

<line x1="480" y1="220" x2="520" y2="220"/>

<line x1="480" y1="280" x2="520" y2="280"/>

<line x1="480" y1="330" x2="520" y2="330"/>



<!-- TOP -->


<line x1="300" y1="80" x2="300" y2="120"/>

<line x1="350" y1="80" x2="350" y2="120"/>

<line x1="400" y1="80" x2="400" y2="120"/>



<!-- BOTTOM -->


<line x1="300" y1="380" x2="300" y2="420"/>

<line x1="350" y1="380" x2="350" y2="420"/>

<line x1="400" y1="380" x2="400" y2="420"/>


</g>






<!-- DATA PULSE -->


<circle r="6" fill="#22D3EE">


<animateMotion

path="M180 170 L220 170"

dur="1s"

repeatCount="indefinite"/>


</circle>



<circle r="6" fill="#A78BFA">


<animateMotion

path="M520 330 L480 330"

dur="1.5s"

repeatCount="indefinite"/>


</circle>






<!-- TITLE -->


<text

x="250"

y="470"

fill="#CBD5E1"

font-size="24"

font-family="JetBrains Mono">

NEURAL AI PROCESSOR

</text>



</svg>
