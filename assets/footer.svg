<svg
width="1600"
height="380"
viewBox="0 0 1600 380"
xmlns="http://www.w3.org/2000/svg">


<defs>


<linearGradient id="bg"
x1="0"
y1="0"
x2="1"
y2="1">

<stop stop-color="#020617"/>

<stop offset="0.5" stop-color="#0F172A"/>

<stop offset="1" stop-color="#020617"/>

</linearGradient>


<filter id="glow">

<feGaussianBlur stdDeviation="5"/>

</filter>


<linearGradient id="cyan">

<stop stop-color="#22D3EE"/>

<stop offset="1" stop-color="#A78BFA"/>

</linearGradient>


</defs>




<!-- Background -->


<rect

width="1600"

height="380"

rx="30"

fill="url(#bg)"/>





<!-- Border -->


<rect

x="20"

y="20"

width="1560"

height="340"

rx="25"

stroke="#22D3EE"

stroke-width="2"

opacity="0.3"/>







<!-- Terminal Window -->


<rect

x="180"

y="70"

width="1240"

height="220"

rx="20"

fill="#020617"

stroke="#334155"

stroke-width="2"/>






<!-- Terminal Header -->


<circle cx="230" cy="110" r="8" fill="#EF4444"/>

<circle cx="260" cy="110" r="8" fill="#EAB308"/>

<circle cx="290" cy="110" r="8" fill="#22C55E"/>



<text

x="340"

y="117"

fill="#94A3B8"

font-size="18"

font-family="monospace">

jemelrey@ai-system: ~

</text>







<!-- Terminal Text -->


<text

x="240"

y="165"

fill="#22D3EE"

font-size="22"

font-family="JetBrains Mono">


&gt; Initializing AI Engineering Environment...


</text>



<text

x="240"

y="205"

fill="#A78BFA"

font-size="22"

font-family="JetBrains Mono">


&gt; Loading Machine Learning Models...


</text>




<text

x="240"

y="245"

fill="#38BDF8"

font-size="22"

font-family="JetBrains Mono">


&gt; Embedded Systems Interface Online...


</text>




<text

x="240"

y="285"

fill="#22C55E"

font-size="22"

font-family="JetBrains Mono">


&gt; STATUS: BUILDING INTELLIGENT SYSTEMS_

</text>







<!-- Blinking Cursor -->


<rect

x="740"

y="265"

width="12"

height="25"

fill="#22D3EE">


<animate

attributeName="opacity"

values="1;0;1"

dur="1s"

repeatCount="indefinite"/>


</rect>








<!-- Floating Code Particles -->


<g fill="#22D3EE">


<circle cx="80" cy="80" r="3">

<animate

attributeName="cy"

values="80;300;80"

dur="8s"

repeatCount="indefinite"/>

</circle>



<circle cx="1500" cy="250" r="4">

<animate

attributeName="cy"

values="250;50;250"

dur="10s"

repeatCount="indefinite"/>

</circle>


</g>



</svg>
